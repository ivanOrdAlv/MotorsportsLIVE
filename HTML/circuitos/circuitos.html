         <script>
      // Script para manejar la transición entre modales
      const loginModal = document.getElementById("loginModal");
      const registerModal = document.getElementById("registerModal");

      loginModal.addEventListener("show.bs.modal", function (event) {
        // Si el modal de registro estaba abierto, lo cerramos
        const registerModalInstance =
          bootstrap.Modal.getInstance(registerModal);
        if (registerModalInstance) {
          registerModalInstance.hide();
        }
      });

      registerModal.addEventListener("show.bs.modal", function (event) {
        // Si el modal de login estaba abierto, lo cerramos
        const loginModalInstance = bootstrap.Modal.getInstance(loginModal);
        if (loginModalInstance) {
          loginModalInstance.hide();
        }
      });

      // Verificar sesión de usuario al cargar la página
      document.addEventListener("DOMContentLoaded", function () {
        // Ejecutar debugging de Supabase (opcional, para desarrollo)
        if (typeof debugSupabase === "function") {
          debugSupabase();
        }

        if (window.checkUserSession) {
          window.checkUserSession();
        } else {
          console.error("checkUserSession no está disponible");
        }
      });
    </script>
