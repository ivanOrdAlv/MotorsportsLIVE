        <script>

document.addEventListener("DOMContentLoaded", async function () {
    const container = document.getElementById("circuitos-container");
    const seasonTitle = document.getElementById("season-title");
    const seasonDropdown = document.getElementById("seasonDropdown");
    const seasonDropdownItems = document.getElementById("seasonDropdownItems");
    
    let currentYear = 2025; // Año por defecto
    
    // Función para cargar las temporadas disponibles
    async function loadSeasons() {
        try {
            const response = await fetch("https://motor-sports-live-api.vercel.app/seasons", {
                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }
            
            const seasons = await response.json();
            
            // Ordenar temporadas de más reciente a más antigua
            seasons.sort((a, b) => b.year - a.year);
            
            // Añadir la temporada actual (2025) si no existe
            if (!seasons.some(season => season.year === 2025)) {
                seasons.unshift({ year: 2025, url: "#" });
            }
            
            // Limpiar el dropdown
            seasonDropdownItems.innerHTML = '';
            
            // Añadir las temporadas al dropdown
            seasons.forEach(season => {
                const item = document.createElement("li");
                const link = document.createElement("a");
                link.classList.add("dropdown-item");
                link.href = "#";
                link.textContent = `Temporada ${season.year}`;
                link.dataset.year = season.year;
                
                // Añadir evento de clic
                link.addEventListener("click", function(e) {
                    e.preventDefault();
                    currentYear = parseInt(this.dataset.year);
                    seasonTitle.textContent = `Temporada ${currentYear}`;
                    loadCircuits(currentYear);
                });
                
                item.appendChild(link);
                seasonDropdownItems.appendChild(item);
            });
            
        } catch (error) {
            console.error("Error al cargar las temporadas:", error);
            seasonDropdownItems.innerHTML = `
                <li><a class="dropdown-item text-danger" href="#">Error al cargar temporadas</a></li>
            `;
        }
    }
    
    // Función para cargar los circuitos de una temporada específica
    async function loadCircuits(year) {
        // Mostrar mensaje de carga
        container.innerHTML = `
            <div class="col-12 text-center my-4">
                <div class="spinner-border text-motorsport" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <p class="mt-2">Cargando circuitos de la temporada ${year}...</p>
            </div>
        `;

        try {
            // Primero, obtener todas las carreras
            const racesResponse = await fetch("https://motor-sports-live-api.vercel.app/races", {
                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (!racesResponse.ok) {
                throw new Error(`Error HTTP: ${racesResponse.status}`);
            }
            
            const allRaces = await racesResponse.json();
            
            // Filtrar carreras por año
            const racesByYear = allRaces.filter(race => race.year === parseInt(year));
            
            // Si no hay carreras para este año, mostrar mensaje
            if (racesByYear.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center my-4">
                        <div class="alert alert-info" role="alert">
                            <i class="bi bi-info-circle"></i> No se encontraron circuitos para la temporada ${year}.
                        </div>
                    </div>
                `;
                return;
            }
            
            // Obtener los IDs de circuitos únicos para este año
            const circuitIds = [...new Set(racesByYear.map(race => race.circuitId))];
            
            // Obtener todos los circuitos
            const circuitosResponse = await fetch("https://motor-sports-live-api.vercel.app/circuitos/", {
                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (!circuitosResponse.ok) {
                throw new Error(`Error HTTP: ${circuitosResponse.status}`);
            }
            
            const allCircuitos = await circuitosResponse.json();
            
            // Filtrar circuitos por IDs
            const circuitosByYear = allCircuitos.filter(circuito => 
                circuitIds.includes(circuito.circuitId)
            );
            
            // Enriquecer los circuitos con información de la carrera
            const enrichedCircuits = circuitosByYear.map(circuito => {
                const race = racesByYear.find(race => race.circuitId === circuito.circuitId);
                return {
                    ...circuito,
                    raceName: race ? race.name : circuito.name,
                    raceDate: race ? race.date : null,
                    round: race ? race.round : null
                };
            });
            
            // Ordenar por ronda
            enrichedCircuits.sort((a, b) => a.round - b.round);
            
            // Limpiar el contenedor
            container.innerHTML = '';
            
            // Renderizar los circuitos
            enrichedCircuits.forEach(circuito => {
                const card = document.createElement("div");
                card.classList.add("col-lg-10", "mb-3");

                // Determinar la categoría basada en el circuitRef
                let categoria = "f1"; // Por defecto
                
                // Puedes personalizar esto según tus datos
                if (circuito.circuitRef.includes("sepang")) {
                    categoria = "motogp";
                } else if (circuito.circuitRef.includes("monte")) {
                    categoria = "wrc";
                }
                
                // Formatear fecha si está disponible
                let dateDisplay = '';
                if (circuito.raceDate) {
                    const date = new Date(circuito.raceDate);
                    dateDisplay = date.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
                }

                card.innerHTML = `
                    <div class="card event-card">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-md-2 text-center">
                                    <div class="event-date">
                                        ${circuito.round ? `<span class="badge bg-dark mb-1">Ronda ${circuito.round}</span><br>` : ''}
                                        <i class="bi bi-geo-alt-fill"></i> ${circuito.country}
                                        ${dateDisplay ? `<br><small>${dateDisplay}</small>` : ''}
                                    </div>
                                </div>
                                <div class="col-md-7">
                                    <span class="event-category category-${categoria}">${categoria.toUpperCase()}</span>
                                    <h5 class="event-location mb-0">${circuito.raceName}</h5>
                                    <small>${circuito.location}, ${circuito.country}</small>
                                </div>
                                <div class="col-md-3 text-md-end mt-2 mt-md-0">
                                    <a href="/HTML/eventos/detalleEventos.html?id=${circuito.circuitId}" class="btn btn-sm btn-outline-dark">Detalles</a>
                                    <a href="/HTML/resultados/resultados.html?id=${circuito.circuitId}" class="btn btn-sm btn-motorsport">Resultados</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        } catch (error) {
            console.error("Error al cargar los circuitos:", error);
            container.innerHTML = `
                <div class="col-12 text-center my-4">
                    <div class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i> Error al cargar los circuitos: ${error.message}
                        <p class="mt-2 small">Asegúrate de que el servidor API esté funcionando en https://motor-sports-live-api.vercel.app/</p>
                    </div>
                    <button class="btn btn-motorsport mt-2" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise"></i> Reintentar
                    </button>
                </div>
            `;
        }
    }
    
    // Inicializar: cargar temporadas y circuitos del año actual
    await loadSeasons();
    loadCircuits(currentYear);
    
    // Añadir evento para los filtros de categoría
    document.querySelectorAll('.btn-group .btn').forEach(button => {
        button.addEventListener('click', function() {
            // Quitar la clase active de todos los botones
            document.querySelectorAll('.btn-group .btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Añadir la clase active al botón clickeado
            this.classList.add('active');
            
            const category = this.textContent.trim().toLowerCase();
            
            // Filtrar los circuitos por categoría
            if (category === 'todos') {
                document.querySelectorAll('.event-card').forEach(card => {
                    card.parentElement.style.display = 'block';
                });
            } else {
                document.querySelectorAll('.event-card').forEach(card => {
                    const cardCategory = card.querySelector('.event-category').textContent.toLowerCase();
                    if (cardCategory === category) {
                        card.parentElement.style.display = 'block';
                    } else {
                        card.parentElement.style.display = 'none';
                    }
                });
            }
        });
    });
});

        </script>

        <div class="text-center mt-4">
            <i class="bi bi-calendar-event"></i>  <a href="../eventos/todosEventos.html" class="btn btn-sm btn-dark">Cargar más eventos</a>
        </div>

    <script>
        // /JS/auth/userSession.js

async function checkUserSession() {
  try {
    console.log("Verificando sesión de usuario...");

    // 1. Verificar si hay datos de usuario en localStorage
    const storedUserData = localStorage.getItem("userData");
    const storedToken = localStorage.getItem("token");

    if (storedUserData && storedToken) {
      // Intentar obtener el usuario a partir del token
      const { data: { user }, error: userError } = await window.supabaseClient.auth.getUser(storedToken);
      if (!userError && user) {
        // Token válido: mostramos menú de usuario con los datos de localStorage
        const userData = JSON.parse(storedUserData);
        showUserInfo(userData);
        return;
      } else {
        // Token inválido: limpiar localStorage
        localStorage.removeItem("token");
        localStorage.removeItem("userData");
      }
    }

    // 2. Si no había datos o el token era inválido, preguntamos a Supabase por la sesión actual
    const { data: { session }, error: sessionError } = await window.supabaseClient.auth.getSession();
    if (sessionError || !session) {
      console.log("No hay sesión activa");
      showLoginButton();
      return;
    }

    // 3. Sí hay sesión activa: recuperamos datos de la tabla "Usuarios"
    const { data: userDataFromDB, error: userErrorFromDB } = await window.supabaseClient
      .from("Usuarios")
      .select("nombre, apellidos, email, tipoUsuario")
      .eq("id", session.user.id)
      .single();

    if (userErrorFromDB || !userDataFromDB) {
      console.error("Error al obtener datos del usuario desde BD:", userErrorFromDB);
      showLoginButton();
      return;
    }

    // 4. Guardamos en localStorage y mostramos el menú de usuario
    localStorage.setItem("token", session.access_token);
    localStorage.setItem(
      "userData",
      JSON.stringify({
        id: session.user.id,
        email: userDataFromDB.email,
        nombre: userDataFromDB.nombre,
        apellidos: userDataFromDB.apellidos,
        tipoUsuario: userDataFromDB.tipoUsuario,
      })
    );
    showUserInfo(userDataFromDB);
  } catch (error) {
    console.error("Error al verificar sesión:", error);
    showLoginButton();
  }
}

// Función para mostrar el botón de inicio de sesión
function showLoginButton() {
  const authContainer = document.getElementById("auth-container");
  if (authContainer) {
    authContainer.innerHTML = `
      <button class="btn btn-motorsport" data-bs-toggle="modal" data-bs-target="#loginModal">
        <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
      </button>
    `;
  }
}

// Función para mostrar la información del usuario en el navbar
function showUserInfo(userData) {
  const authContainer = document.getElementById("auth-container");
  if (!authContainer) return;

  authContainer.innerHTML = `
    <div class="user-menu">
      <button class="user-menu-toggle" onclick="toggleUserMenu()">
        <i class="bi bi-person-circle"></i>
        <span>${userData.nombre}</span>
        <i class="bi bi-chevron-down"></i>
      </button>
      <div class="user-menu-dropdown" id="userMenuDropdown">
        <a href="/HTML/cuenta/verCuenta.html" class="user-menu-item">
          <i class="bi bi-person"></i> Mi Perfil
        </a>
        ${
          userData.tipoUsuario === "Editor"
            ? '<a href="/HTML/editor/editor.html" class="user-menu-item"><i class="bi bi-pencil-square"></i> Panel de Editor</a>'
            : ""
        }
        ${
          userData.tipoUsuario === "Administrador"
            ? '<a href="/HTML/admin/admin.html" class="user-menu-item"><i class="bi bi-gear"></i> Panel de Administración</a>'
            : ""
        }
        <div class="user-menu-divider"></div>
        <a href="#" class="user-menu-item logout" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </a>
      </div>
    </div>
  `;
}

// Función para alternar el dropdown de usuario
function toggleUserMenu() {
  const dropdown = document.getElementById("userMenuDropdown");
  if (dropdown) dropdown.classList.toggle("show");
}

// Función para cerrar sesión
async function logout() {
  try {
    console.log("Cerrando sesión...");

    const { error } = await window.supabaseClient.auth.signOut();
    if (error) console.error("Error al cerrar sesión:", error);

    localStorage.removeItem("token");
    localStorage.removeItem("userData");
    localStorage.removeItem("primerAcceso");
    localStorage.removeItem("refreshToken");

    window.location.reload();
  } catch (error) {
    console.error("Error al cerrar sesión:", error);
    alert("Error al cerrar sesión. Por favor, inténtalo de nuevo.");
  }
}

// Cerramos el menú si el usuario hace clic fuera
document.addEventListener("click", (event) => {
  const userMenu = document.querySelector(".user-menu");
  const dropdown = document.getElementById("userMenuDropdown");
  if (userMenu && dropdown && !userMenu.contains(event.target)) {
    dropdown.classList.remove("show");
  }
});

export { checkUserSession, toggleUserMenu, logout };

// Exponemos las funciones globales
window.checkUserSession = checkUserSession;
window.toggleUserMenu = toggleUserMenu;
window.logout = logout;

    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
  const loginForm = document.getElementById("loginForm")

  if (loginForm) {
    loginForm.addEventListener("submit", handleLogin)
  }
})

async function handleLogin(event) {
  event.preventDefault()

  // Obtener los datos del formulario
  const email = document.getElementById("loginEmail").value
  const password = document.getElementById("loginPassword").value
  const rememberMe = document.getElementById("rememberMe").checked

  // Validar datos
  if (!email || !password) {
    mostrarNotificacion("Por favor, ingresa tu correo electrónico y contraseña.", "error")
    return
  }

  // Mostrar indicador de carga
  const submitBtn = event.target.querySelector('button[type="submit"]')
  const originalBtnText = submitBtn.innerHTML
  submitBtn.innerHTML =
    '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Iniciando sesión...'
  submitBtn.disabled = true

  try {
    console.log("Iniciando sesión...")

    // Iniciar sesión en Supabase Auth
    const { data, error } = await window.supabaseClient.auth.signInWithPassword({
      email,
      password,
    })

    console.log("Respuesta de signIn:", { data, error })

    if (error) {
      throw new Error(error.message)
    }

    if (!data.user || !data.session) {
      throw new Error("No se pudo iniciar sesión")
    }

    // Guardar token
    localStorage.setItem("token", data.session.access_token)

    // Si es "recordarme", guardar el refresh token
    if (rememberMe) {
      localStorage.setItem("refreshToken", data.session.refresh_token)
    }

    // Verificar si es primer acceso consultando la tabla Usuarios
    const { data: userData, error: userError } = await window.supabaseClient
      .from("Usuarios")
      .select("nombre, apellidos, email, tipoUsuario")
      .eq("id", data.user.id)
      .single()

    console.log("Datos del usuario:", { userData, userError })

    // Guardar datos del usuario
    if (userData) {
      localStorage.setItem(
        "userData",
        JSON.stringify({
          id: data.user.id,
          email: userData.email,
          nombre: userData.nombre,
          apellidos: userData.apellidos,
          tipoUsuario: userData.tipoUsuario,
        }),
      )
    }

    // Restaurar botón
    submitBtn.innerHTML = originalBtnText
    submitBtn.disabled = false

    // Cerrar modal
    const loginModal = bootstrap.Modal.getInstance(document.getElementById("loginModal"))
    if (loginModal) {
      loginModal.hide()
    }

    // Actualizar la interfaz
    if (typeof checkUserSession === "function") {
      checkUserSession()
    }

    // Mostrar mensaje de éxito
    mostrarNotificacion(`¡Bienvenido${userData?.nombre ? " " + userData.nombre : ""}!`, "success")

    // Determinar redirección según el tipo de usuario y si es primer acceso
    if (userError || !userData) {
      // Si no hay datos en la tabla Usuarios, consideramos que es primer acceso
      localStorage.setItem("primerAcceso", "true")
      setTimeout(() => {
        window.location.href = "/HTML/index.html"
      }, 1000)
    } else {
      // Redirigir según el tipo de usuario
      setTimeout(() => {
        switch (userData.tipoUsuario) {
          case "Administrador":
            window.location.href = "/HTML/admin/admin.html"
            break
          case "Editor":
            window.location.href = "/HTML/editor/editor.html"
            break
          default:
            // Recargar la página actual para usuarios invitados
            window.location.reload()
        }
      }, 1000)
    }
  } catch (error) {
    console.error("Error:", error)
    mostrarNotificacion(`Error al iniciar sesión: ${error.message}`, "error")

    // Restaurar botón
    submitBtn.innerHTML = originalBtnText
    submitBtn.disabled = false
  }
}

// Función para mostrar notificaciones
function mostrarNotificacion(mensaje, tipo) {
  // Si existe un sistema de notificaciones, usarlo
  if (window.toast) {
    window.toast(mensaje, { type: tipo })
    return
  }

  // Si no, usar alert para errores y console.log para éxitos
  if (tipo === "error") {
    alert(mensaje)
  } else {
    console.log(mensaje)
  }
}

    </script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
  const registerForm = document.getElementById("registerForm")

  if (registerForm) {
    registerForm.addEventListener("submit", handleRegister)
  }
})

async function handleRegister(event) {
  event.preventDefault()

  // Obtener los datos del formulario
  const nombre = document.getElementById("registerFirstName").value
  const apellidos = document.getElementById("registerLastName").value
  const email = document.getElementById("registerEmail").value
  const password = document.getElementById("registerPassword").value
  const confirmPassword = document.getElementById("registerConfirmPassword").value
  const termsAccepted = document.getElementById("termsCheck").checked

  // Validar datos
  if (!nombre || !apellidos || !email || !password) {
    mostrarNotificacion("Por favor, completa todos los campos obligatorios.", "error")
    return
  }

  if (password !== confirmPassword) {
    mostrarNotificacion("Las contraseñas no coinciden.", "error")
    return
  }

  if (!termsAccepted) {
    mostrarNotificacion("Debes aceptar los términos y condiciones para continuar.", "error")
    return
  }

  // Mostrar indicador de carga
  const submitBtn = event.target.querySelector('button[type="submit"]')
  const originalBtnText = submitBtn.innerHTML
  submitBtn.innerHTML =
    '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Registrando...'
  submitBtn.disabled = true

  try {
    console.log("Iniciando registro de usuario...")

    // Paso 1: Registrar usuario en Supabase Auth
    const { data: authData, error: authError } = await window.supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: {
          nombre,
          apellidos,
          tipoUsuario: "Invitado",
        },
      },
    })

    console.log("Respuesta de signUp:", { authData, authError })

    if (authError) {
      throw new Error(authError.message)
    }

    if (!authData.user) {
      throw new Error("No se pudo crear el usuario en Authentication")
    }

    console.log("Usuario registrado en Auth:", authData.user.id)

    // Paso 2: Esperar un momento para asegurar que el usuario esté completamente creado
    await new Promise((resolve) => setTimeout(resolve, 1000))

    // Paso 3: Crear entrada en la tabla Usuarios
    console.log("Insertando datos en tabla Usuarios...")

    const { data: userData, error: userError } = await window.supabaseClient
      .from("Usuarios")
      .insert([
        {
          id: authData.user.id,
          email: email,
          nombre: nombre,
          apellidos: apellidos,
          tipoUsuario: "Invitado",
          Contrasenia: password, // Guardar la contraseña encriptada
        },
      ])
      .select()

    console.log("Respuesta de inserción en Usuarios:", { userData, userError })

    if (userError) {
      console.error("Error detallado al crear entrada en Usuarios:", userError)

      // Si hay error, intentar verificar si el usuario ya existe
      const { data: existingUser, error: checkError } = await window.supabaseClient
        .from("Usuarios")
        .select("*")
        .eq("id", authData.user.id)
        .single()

      console.log("Verificación de usuario existente:", { existingUser, checkError })

      if (!existingUser) {
        // Si no existe y hay error, mostrar el error específico
        throw new Error(`Error al guardar datos del usuario: ${userError.message}`)
      }
    }

    // Paso 4: Verificar que los datos se guardaron correctamente
    const { data: verificationData, error: verificationError } = await window.supabaseClient
      .from("Usuarios")
      .select("*")
      .eq("id", authData.user.id)
      .single()

    console.log("Verificación final:", { verificationData, verificationError })

    if (verificationError || !verificationData) {
      throw new Error("Los datos del usuario no se guardaron correctamente en la base de datos")
    }

    console.log("✅ Usuario guardado exitosamente en ambas tablas")

    // Paso 5: Guardar datos en localStorage
    if (authData.session) {
      localStorage.setItem("token", authData.session.access_token)
    }
    localStorage.setItem("primerAcceso", "true")

    // Guardar datos básicos del usuario
    localStorage.setItem(
      "userData",
      JSON.stringify({
        id: authData.user.id,
        email: email,
        nombre: nombre,
        apellidos: apellidos,
        tipoUsuario: "Invitado",
        
      }),
    )

    // Restaurar botón
    submitBtn.innerHTML = originalBtnText
    submitBtn.disabled = false

    // Cerrar modal
    const registerModalElement = document.getElementById("registerModal")
    if (registerModalElement) {
      const registerModal = bootstrap.Modal.getInstance(registerModalElement)
      if (registerModal) {
        registerModal.hide()
      }
    }

    // Actualizar la interfaz para mostrar el nombre del usuario
    if (typeof checkUserSession === "function") {
      checkUserSession()
    }

    // Mostrar mensaje de éxito
    mostrarNotificacion("¡Registro exitoso! Usuario guardado correctamente.", "success")

    // Redirigir a la página de primer acceso
    setTimeout(() => {
      window.location.href = "/HTML/index.html"
    }, 2000)
  } catch (error) {
    console.error("❌ Error completo:", error)
    mostrarNotificacion(`Error al registrar: ${error.message}`, "error")

    // Restaurar botón
    submitBtn.innerHTML = originalBtnText
    submitBtn.disabled = false
  }
}

// Función para mostrar notificaciones
function mostrarNotificacion(mensaje, tipo) {
  // Si existe un sistema de notificaciones, usarlo
  if (window.toast) {
    window.toast(mensaje, { type: tipo })
    return
  }

  // Si no, usar alert para errores y console.log para éxitos
  if (tipo === "error") {
    alert(mensaje)
  } else {
    console.log(mensaje)
    alert(mensaje) // También mostramos alertas para éxitos importantes como el registro
  }
}
